<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oshi Push - Card Library</title>
<style>
  :root { --bg:#14111f; --panel:#1e1a2e; --line:#3a3354; --text:#f1eefb; --dim:#9d95b8; --pink:#ff6fae; }
  * { box-sizing: border-box; }
  body { margin:0; padding:20px; background:var(--bg); color:var(--text); font:15px/1.5 system-ui, sans-serif; }
  h1 { margin:0 0 4px; color:var(--pink); }
  a { color:var(--pink); }
  .bar { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0; }
  input, select { font:inherit; background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:6px 8px; }
  #search { flex:1 1 220px; }
  #grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(130px, 1fr)); gap:10px; }
  .tile { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:6px; text-align:left; cursor:pointer; font:inherit; font-size:12px; display:flex; flex-direction:column; gap:3px; }
  .tile { position:relative; }
  .noart { position:absolute; left:10px; top:10px; background:rgba(26,16,32,.85); color:#fcd34d; font-size:11px; font-style:normal; padding:0 7px; border-radius:8px; }
  .tile:hover, .tile:focus-visible { border-color:var(--pink); outline:none; }
  .tile span { color:var(--dim); }
  .art { aspect-ratio:5/7; background:linear-gradient(135deg,#4c3f7a,#2b2542); border-radius:4px; overflow:hidden; }
  .art img, .big img { width:100%; height:100%; object-fit:contain; display:block; }
  .meta { color:var(--dim); font-size:13px; margin:2px 0; }
  .badge { background:#2b2542; border:1px solid var(--line); border-radius:10px; padding:0 8px; font-size:12px; margin-left:6px; }
  .badge.ok { border-color:#7dd3fc; color:#7dd3fc; }
  #detail { position:fixed; inset:0; background:rgba(0,0,0,.7); display:flex; align-items:center; justify-content:center; padding:16px; }
  #detail[hidden] { display:none; }
  .panel { position:relative; background:var(--panel); border:1px solid var(--pink); border-radius:12px; padding:16px; display:flex; gap:18px; max-width:760px; max-height:92vh; overflow:auto; flex-wrap:wrap; }
  .big { width:260px; aspect-ratio:5/7; background:linear-gradient(135deg,#4c3f7a,#2b2542); border-radius:8px; overflow:hidden; flex:0 0 auto; }
  .panel > div:last-child { flex:1 1 260px; }
  .close { position:absolute; top:10px; right:10px; background:var(--pink); color:#1a1020; border:0; border-radius:6px; padding:4px 10px; font-weight:600; cursor:pointer; }
  table { border-collapse:collapse; }
  td { padding:2px 12px 2px 0; vertical-align:top; } td:first-child { color:var(--dim); }
  .fx { background:#2b2542; border-radius:8px; padding:10px; }
</style>
</head>
<body>
<h1>Card Library</h1>
<div class="meta"><a href="/">Back to game</a> · <a href="decks.html">Deck builder</a> · <span id="summary"></span> · <span id="count"></span></div>
<div class="bar">
  <input id="search" type="search" placeholder="Search name, ID, effect text or tags">
  <select id="f-type"></select><select id="f-class"></select><select id="f-style"></select>
  <select id="f-genre"></select><select id="f-set"></select>
  <select id="f-art"><option value="">Art: all</option><option value="with">Has art</option><option value="without">No art</option></select>
</div>
<div id="grid"></div>
<div id="detail" hidden></div>
<script src="library.js"></script>
</body>
</html>
