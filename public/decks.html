<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oshi Push - Deck Builder</title>
<style>
  :root { --bg:#14111f; --panel:#1e1a2e; --line:#3a3354; --text:#f1eefb; --dim:#9d95b8; --pink:#ff6fae; }
  * { box-sizing: border-box; }
  body { margin:0; padding:20px; background:var(--bg); color:var(--text); font:15px/1.5 system-ui, sans-serif; }
  h1 { margin:0 0 4px; color:var(--pink); } h2 { margin:14px 0 4px; font-size:16px; }
  a { color:var(--pink); }
  input, select, button { font:inherit; border-radius:6px; }
  input, select { background:var(--panel); color:var(--text); border:1px solid var(--line); padding:6px 8px; }
  button { background:var(--pink); color:#1a1020; border:0; padding:5px 10px; font-weight:600; cursor:pointer; }
  button:focus-visible { outline:2px solid var(--text); outline-offset:2px; }
  .meta { color:var(--dim); font-size:13px; margin:2px 0; }
  .wrap { display:grid; grid-template-columns:1fr 380px; gap:16px; align-items:start; }
  @media (max-width: 900px) { .wrap { grid-template-columns:1fr; } }
  .bar { display:flex; flex-wrap:wrap; gap:8px; margin:8px 0; }
  #search { flex:1 1 200px; }
  #grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(112px, 1fr)); gap:8px; }
  .tile { position:relative; background:var(--panel); color:var(--text); border:1px solid var(--line); text-align:left; font-weight:400; font-size:12px; padding:5px; display:flex; flex-direction:column; gap:2px; border-radius:8px; }
  .tile:hover { border-color:var(--pink); }
  .tile span { color:var(--dim); }
  .art { aspect-ratio:5/7; background:linear-gradient(135deg,#4c3f7a,#2b2542); border-radius:4px; overflow:hidden; }
  .art img { width:100%; height:100%; object-fit:contain; display:block; }
  .noart { position:absolute; left:8px; top:8px; background:rgba(26,16,32,.85); color:#fcd34d; font-size:11px; font-style:normal; padding:0 7px; border-radius:8px; }
  .in { position:absolute; top:8px; right:8px; background:var(--pink); color:#1a1020; border-radius:10px; padding:0 7px; font-style:normal; font-weight:700; }
  .in:empty { display:none; }
  .deck { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; position:sticky; top:12px; max-height:calc(100vh - 24px); overflow:auto; }
  .row { display:flex; gap:8px; align-items:center; padding:2px 0; font-size:13px; } .row .nm { flex:1; } .row span { color:var(--dim); }
  .row button { padding:1px 8px; }
  .chip { display:inline-block; border:1px solid var(--line); border-radius:10px; padding:0 9px; margin-right:6px; font-size:13px; }
  .chip.ok { border-color:#7dd3fc; color:#7dd3fc; }
  #problems { margin:6px 0; padding-left:18px; color:#fca5a5; font-size:13px; } #problems .good { color:#86efac; list-style:none; margin-left:-18px; }
  #msg { color:#fcd34d; min-height:1.4em; font-size:13px; }
  .tools { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0; }
</style>
</head>
<body>
<h1>Deck Builder</h1>
<div class="meta"><a href="/">Back to game</a> · <a href="cards.html">Card library</a> · A deck is 1 Persona, 5 Platform cards and 40 main deck cards (max 3 copies of a card).</div>
<div class="wrap">
  <div>
    <div class="bar">
      <input id="search" type="search" placeholder="Search name, ID, effect text or tags">
      <select id="f-type"></select><select id="f-class"></select><select id="f-style"></select><select id="f-genre"></select>
      <select id="f-art"><option value="">Art: all</option><option value="with">Has art</option><option value="without">No art</option></select>
    </div>
    <div id="grid"></div>
  </div>
  <aside class="deck">
    <div class="tools"><select id="saved"></select><button id="new">New</button><button id="delete">Delete</button><button id="random">Random deck</button></div>
    <div class="tools"><input id="name" placeholder="Deck name"><button id="save">Save deck</button></div>
    <div id="msg"></div>
    <div id="counts"></div>
    <ul id="problems"></ul>
    <h2>Persona</h2><div id="persona"></div>
    <h2>Platforms</h2><div id="platforms"></div>
    <h2>Main deck</h2><div id="main"></div>
  </aside>
</div>
<script src="decks.js"></script>
</body>
</html>
